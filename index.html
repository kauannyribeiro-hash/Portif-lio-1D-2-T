<!DOCTYPE html> <1--serve para identificar a linguagem de programação que está sendo utilizada.-->
<html lang="pt-br"> <!-- abertura do documento, delimita o espaço de codificação. Todas as tags devem ser colocadas nesses espaço.--> 
<head> <!---- tag que define o cabeçalho do documento. Tudo o que for escrito dentro dessa tag não aparecerá na página principal. Dentro dessa tag pode ser inserida folhas de estilo e script. -->
    <meta charset="UTF-8"> <!--especifica qual o conjunto de caracteres(character ou charset), será usado para renderizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metadados sobre a sua página-->
    <title>Portfólio</title> <!--título da página-->
</head> <!--Fechamento do cabeçalho-->
<body> <!--nesse espaço está contido o conteúdo visual da página. As tags que representam texto, botões e outros, devem ser adicionadas nesse intervalo.--> 
    <!--Um documento HTML é composto por tags que são escritas < >. As tags precisam ser abertas e fechadas, o que as  diferenciam é que tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, ou nem isso, como no caso da tag meta. OUtro aspecto é que ela é case insensetive, ou seja, não leva em consideração a diferença entre letras 
</body>
</html> <!-- fechamento da tag, documento. -->
